[project]
name = "qwerty-midi-keyboard"
version = "1.0.0"
description = "Turn your typing keyboard into a MIDI piano controller for Pianoteq or any VST"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "CppDevVS2026"}]
dependencies = [
    "python-rtmidi>=1.5.0",
]

[project.scripts]
qwerty-midi = "qwerty_midi.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
